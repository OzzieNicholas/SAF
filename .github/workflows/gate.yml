# 验收门 CI：用 environment.yml 重建 saf 环境，跑 pytest（含仓库布局检查）并把验收门状态写进 job summary。
# CI 成败以 pytest 为准；tests/gate.py 的完整裁决只作展示（|| true）。
name: gate

on: [push, pull_request]

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - name: 建 conda 环境 saf
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true
      - name: pytest
        run: micromamba run -n saf python -m pytest tests -q
      - name: 验收门状态
        if: always()
        run: micromamba run -n saf python tests/gate.py --format md >> "$GITHUB_STEP_SUMMARY" || true
