# 动作规范 CI（git 历史 / 分支）：把 charter/conventions.md 的规范变成会红的门。
# 纯 stdlib、无 conda（与 gate.yml 的代码验证器分工：这里守 git 历史/动作，那里守工作树真相）。
# 权威 spec 见 tools/check_conventions.py。
name: conventions

on: [push, pull_request]

jobs:
  conventions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 需完整历史以定位 conventions.md 引入点 + 遍历提交
      - name: 取 main 作 base（排除 base 历史 + 合并提交）
        run: git fetch --no-tags origin main:refs/remotes/origin/main || true
      - name: 校验 commit 主题 + 分支名规范
        # PR 用 head_ref（真源分支，非 1/merge）；push 用 ref_name。base=main 只查本分支新增（非 merge）。
        run: python3 tools/check_conventions.py --branch "${{ github.head_ref || github.ref_name }}" --base origin/main
