# params.yaml — 几何 oracle / 采样 / 标签 的**冻结口径文档（D-021 台账镜像）**。
#
# ⚠️ 本文件当前**非加载配置**（无 Hydra/OmegaConf 接线）：代码里只有 tools/build_fusion360.py 的 _root_from_params()
#    读 `data.fusion360_root`；其余数值均在 src/tools 里**硬编为默认值**（如 n_directions=128 / resolution=48 /
#    radius_world=0.05）。**改此处不改 runtime**——要改冻结值须同时改代码默认，并在 charter/decisions.md 新增
#    supersede 条目（D-021 / D-003 连续数值条款）。本文件作口径的单一登记之家（读者语言）。
# 离散选择（语义C / 球模型 / 基板不建模+下半球 / 体素腐蚀口径 / 二分类）已冻结，见 D-001..D-005。

oracle:
  semantic: C                    # D-001 多方向直线插入无碰撞（不可改，见 constraints §4）
  tool_model: ball               # D-005 球模型、方向灵活
  model_build_plate: false       # D-002 基板不建模
  approach_hemisphere: lower      # D-002 工具从下半球逼近；只计零件本体遮挡（遮挡下界）
  method: voxel_erosion          # D-003 体素/距离场腐蚀 + 边界带精确胶囊细化
  direction_sampling: fibonacci_hemisphere
  n_directions: 128              # 冻结 D-021（真实收敛 128-vs-256=0.982；64 尚差 5%）
  epsilon_voxels: 1.5            # 冻结 D-021；D-020 精确细化的边界带宽
  boundary_refine: exact_capsule # 边界带用精确胶囊-网格求交细化

geometry:
  normalize: longest_edge_1      # 最长包围盒边 = 1
  overhang_angle_deg: 45         # 冻结 D-021（D-010）；鲁棒性可扫 40/50

labels:
  mode: binary                   # D-004 二分类先行

split:
  by: model                      # 必须按模型切分；禁止按点随机切分
  frac_train: 0.6                # 物化数据集三切（D-016 切分 {train,val,test}）
  frac_val: 0.2                  # val 为**预留 held-out**：超参先验固定、当前工具未在 val 上调参（见各 tool 的 _fva）；余为 test（Thingi10K 恒 test）

data:
  # 公开 CAD 主源 = Fusion 360 Gallery reconstruction 网格（D-017）；只用最终零件 .obj，不碰构造序列/B-Rep。
  source: fusion360              # {procedural, fusion360, thingi10k(恒 test)}（ABC 已弃用，D-023）
  fusion360_root: ""             # 本地 reconstruction 目录（gitignore；仅本键被代码消费，未决 fusion360-ingest）
  resolution: 48                 # 冻结 D-021 + 精确细化开（D-020：低 res 即 res-稳定训练级）
  radius_world: 0.05             # 冻结 D-021（主工具半径；H2 验证工具尺寸要紧）

# —— 计划 / 未接线（当前代码**不消费**；未冻、待未来敏感性扫接线，勿当作活配置）——
#   tool.radii: [0.02, 0.05]                多半径敏感性扫（现只用单一 radius_world；H2 半径敏感性图属未来工作）
#   sampling.method: poisson_disk_area      面积均匀（蓝噪声）接触点采样；现真实网格用「下朝悬垂面质心」逐三角（非面积均匀），
#   sampling.contact_points_per_model: 3000 故 eval_h1 的「支撑面积」实为下朝面**计数**代理（见 eval_h1 / eval area_err 注）
#   labels.emit_uncertain_band              边界不确定单列；现判定口径不产出 UNCERTAIN（D-020），Label.UNCERTAIN 保留待用
