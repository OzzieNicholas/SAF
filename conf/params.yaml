# params.yaml — Hydra 配置（几何 oracle / 采样 / 标签）
#
# 标签口径连续数值经 **D-021 冻结**（n_directions / epsilon_voxels / data.resolution+细化 / radius_world / overhang）；
# 改动须 charter/decisions.md 新增条目 supersede（同 D-003 连续数值条款）。仍标"临时"者（采样点数/多半径/uncertain_band）为未来敏感性扫、未冻。
# 离散选择（语义C / 球模型 / 基板不建模+下半球 / 体素腐蚀口径 / 二分类）已冻结，见 D-001..D-005。

oracle:
  semantic: C                    # D-001 多方向直线插入无碰撞（不可改，见 constraints §4）
  tool_model: ball               # D-005 球模型、方向灵活
  model_build_plate: false       # D-002 基板不建模
  approach_hemisphere: lower      # D-002 工具从下半球逼近；只计零件本体遮挡（遮挡下界）
  method: voxel_erosion          # D-003 体素/距离场腐蚀 + 边界带精确胶囊细化
  direction_sampling: fibonacci_hemisphere
  n_directions: 128              # 冻结 D-021（真实收敛 128-vs-256=0.982；64 尚差 5%）
  voxel_res: 256                 # 作废：被 data.resolution + 精确细化取代（D-021/D-020）
  epsilon_voxels: 1.5            # 冻结 D-021；D-020 精确细化的边界带宽
  boundary_refine: exact_capsule # 边界带用精确胶囊-网格求交细化

tool:
  # 相对归一尺度（geometry.normalize）的工具半径；须对齐槽宽分布使 H2（工具尺寸不可忽略）可显
  radii: [0.02, 0.05]            # 临时：主半径 + 一个变化半径

geometry:
  normalize: longest_edge_1      # 最长包围盒边 = 1
  overhang_angle_deg: 45         # 冻结 D-021（D-010）；鲁棒性可扫 40/50

sampling:
  contact_points_per_model: 3000 # 临时；范围 2000–5000
  method: poisson_disk_area      # 按面积均匀（蓝噪声）

labels:
  mode: binary                   # D-004 二分类先行
  emit_uncertain_band: true      # 边界不确定单列（可排除/降权/单独报告）

split:
  by: model                      # 必须按模型切分；禁止按点随机切分
  frac_train: 0.6                # 物化数据集三切（D-016 切分 {train,val,test}）；调参只用 val
  frac_val: 0.2                  # 余为 test（Thingi10K 接入时恒 test，见 deferred）

data:
  # 公开 CAD 主源 = Fusion 360 Gallery reconstruction 网格（D-017）；只用最终零件 .obj，不碰构造序列/B-Rep。
  source: fusion360              # {procedural, fusion360, abc(可选/背景), thingi10k(恒 test)}
  fusion360_root: ""             # 本地 reconstruction 目录（gitignore；路径经此配置不入库，未决 fusion360-ingest）
  resolution: 48                 # 冻结 D-021 + 精确细化开（D-020：低 res 即 res-稳定训练级）
  radius_world: 0.05             # 冻结 D-021（主工具半径；H2 验证工具尺寸要紧）
