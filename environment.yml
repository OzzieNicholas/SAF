# SAF 开发环境（环境依赖的唯一权威源）
# 创建：conda env create -f environment.yml            （在仓库根目录运行；会以可编辑方式安装本包）
# 更新：conda env update -f environment.yml --prune
#
# 神经栈默认使用 CUDA 12.4 轮子；无 GPU 或其他 CUDA 版本时，改下面的 extra-index-url（cpu / cu121 / cu126）。
# torch（Intel OpenMP）与 numpy/scipy（LLVM OpenMP）同进程可能触发重复加载中止，
# 由 support_accessibility.runtime.console.setup_console() 与 tests/conftest.py 统一设置 KMP_DUPLICATE_LIB_OK 兜底。
name: saf
channels:
  - conda-forge
dependencies:
  - python=3.12
  - igl
  - numpy
  - scipy
  - trimesh
  - pyyaml
  - pytest
  - tectonic=0.17.0            # 论文 PDF 编译：paper/pipeline/build_paper.py 调用
  - pip
  - pip:
    - --extra-index-url https://download.pytorch.org/whl/cu124
    - torch==2.6.0+cu124
    - matplotlib==3.11.1         # 论文图件：统计图与示意图
    - pyvista==0.48.4            # 论文图件：3D 网格离屏渲染（需 OpenGL 上下文）
    - pypdf==6.1.1               # 图件 QA：PDF 页面尺寸、字体嵌入与 Type 3 检查
    - pillow                     # 图件 QA：PNG 分辨率、空白检测与预览拼图（matplotlib 亦依赖）
    - -e .                       # 本包（support_accessibility），源码在 src/
