[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "support-accessibility"
version = "0.0.0"
description = "Support Accessibility Field — 金属AM支撑接触区几何可达性代理评价与神经预测"
requires-python = ">=3.10"

# 依赖在工具链 spike 时补齐（numpy/scipy/trimesh/open3d + torch + hydra/dvc + pytest/hypothesis）

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
