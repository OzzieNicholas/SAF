[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "support-accessibility"
version = "0.0.0"
description = "Support Accessibility Field — 金属AM支撑接触区几何可达性代理评价与神经预测"
requires-python = ">=3.12"
dependencies = ["numpy", "scipy", "trimesh", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest"]

# igl、torch、matplotlib 等重依赖以 environment.yml 为唯一权威源；此处只列纯 Python 的最小集。

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
